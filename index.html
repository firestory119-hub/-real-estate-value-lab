<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부동산 밸류랩</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18243b;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}.wrap{max-width:1080px;margin:auto;padding:32px 18px}header{background:#14243c;color:white;padding:28px 0}header h1{margin:0;font-size:27px}header p{color:#b9cbe4;margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 15px #1b35500a}.metric{font-size:27px;font-weight:750;margin:10px 0}.muted{color:#64748b;font-size:13px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;font-weight:600;font-size:13px}select,input{border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:white;font:inherit}canvas{max-height:420px}h2{font-size:19px;margin:0 0 14px}.note{background:#fff8e6;padding:14px;border-radius:10px;color:#77541c;font-size:13px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px}}
</style></head><body><header><div class="wrap"><h1>🏙️ 부동산 밸류랩</h1><p>주식 POR 밴드처럼 보는 부동산 적정가치 분석</p></div></header><main class="wrap"><section class="panel"><h2>분석 조건</h2><div class="controls"><label>분석 모델<select id="model"><option value="noI">순영업소득(NOI) 배수</option><option value="rent">순임대수익률</option></select></label><label>기간<select id="period"><option value="10">10년</option><option value="5">5년</option></select></label><label>연간 순영업소득 (만원)<input id="noi" type="number" min="1" value="2000"></label></div></section><section class="grid"><div class="panel"><div class="muted">현재 가상 매매가격</div><div class="metric" id="price">-</div><div class="muted">마지막 예시 시점 기준</div></div><div class="panel"><div class="muted">기준 적정가치</div><div class="metric" id="fair">-</div><div class="muted" id="basis">NOI 20배 기준</div></div><div class="panel"><div class="muted">적정가치 대비 괴리율</div><div class="metric" id="gap">-</div><div class="muted">양수는 기준가 대비 높은 가격</div></div></section><section class="panel"><h2>매매가격과 가치평가 밴드</h2><canvas id="chart" aria-label="가상 부동산 가격 및 밸류에이션 밴드"></canvas></section><section class="panel"><h2>해석 방법</h2><p id="explain"></p><div class="note"><strong>주의: 현재 모든 가격·수익 데이터는 가상 예시입니다.</strong> 실제 아파트 실거래가, 전세가, PIR 데이터와 연결되지 않았습니다. 이 화면은 계산 방식과 차트 UI를 검증하는 시제품이며 투자 판단 근거로 사용하면 안 됩니다.</div></section></main><script>
const years=Array.from({length:10},(_,i)=>String(2017+i));const sample=[3.6,3.8,4.1,4.5,5.0,4.7,4.2,4.0,4.4,4.6];let chart;
function fmt(v){return v.toFixed(2)+'억 원'}
function render(){const noi=Math.max(1,Number(document.getElementById('noi').value)||2000)/10000;const rent=document.getElementById('model').value==='rent';const multiples=rent?[1/.07,1/.05,1/.04]:[15,20,25];const p=Number(document.getElementById('period').value);const labels=years.slice(-p),prices=sample.slice(-p),fair=noi*multiples[1],last=prices.at(-1),gap=(last/fair-1)*100;document.getElementById('price').textContent=fmt(last);document.getElementById('fair').textContent=fmt(fair);document.getElementById('gap').textContent=(gap>=0?'+':'')+gap.toFixed(1)+'%';document.getElementById('basis').textContent=rent?'순수익률 5% 기준':'NOI 20배 기준';document.getElementById('explain').textContent='연간 순영업소득 '+(noi*10000).toLocaleString()+'만 원을 기준으로 세 가지 가치평가 수준을 계산합니다. 순영업소득은 임대수입에서 운영비를 뺀 값이며 금융비용과 세금의 취급은 분석 목적에 따라 구분해야 합니다.';const datasets=[{label:'가상 매매가격',data:prices,borderColor:'#2563eb',backgroundColor:'#2563eb',borderWidth:3,tension:.3},{label:rent?'순수익률 7%':'NOI 15배',data:labels.map(()=>noi*multiples[0]),borderColor:'#16a34a',borderDash:[5,4],pointRadius:0},{label:rent?'순수익률 5%':'NOI 20배',data:labels.map(()=>fair),borderColor:'#f59e0b',borderDash:[5,4],pointRadius:0},{label:rent?'순수익률 4%':'NOI 25배',data:labels.map(()=>noi*multiples[2]),borderColor:'#dc2626',borderDash:[5,4],pointRadius:0}];if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels,datasets},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y)}}},scales:{y:{title:{display:true,text:'억원'},beginAtZero:false}}}})}
document.querySelectorAll('select,input').forEach(x=>x.addEventListener('input',render));render();
</script></body></html>
